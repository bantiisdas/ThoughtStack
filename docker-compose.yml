name: thoughtstack-backend

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    image: supdev20/thoughtstack-backend:v1
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Published for local/dev. On the VPS, prefer HTTPS via: docker compose --profile https up -d
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      # Override .env localhost — required inside Docker (service DNS names)
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true"
      # Prefer root/.env or export; falls back so Vercel is never stuck on localhost
      CORS_ORIGIN: ${CORS_ORIGIN:-https://thought-stack-ai.vercel.app,http://localhost:3000}
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    image: supdev20/thoughtstack-backend:v1
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    env_file:
      - ./backend/.env
    environment:
      # Override .env localhost — required inside Docker (service DNS names)
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "false"
    depends_on:
      - redis
      - api
    restart: unless-stopped

  caddy:
    profiles: ["https"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - path: ./.env
        required: false
    environment:
      # Only needed with: docker compose --profile https up -d
      API_DOMAIN: ${API_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-dev@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
  caddy_config:
