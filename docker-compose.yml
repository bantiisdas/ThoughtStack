name: thoughtstack-backend

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: uploads
      RUN_MIGRATIONS: "true"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: uploads
      RUN_MIGRATIONS: "false"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - redis
      - qdrant
      - api
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  backend_uploads:
